syntax = "proto3";

package tracking;

option java_multiple_files = true;
option java_package = "com.convoy.tracking.grpc";

service TrackingService {
  // client-streaming: driver app keeps sending pings on one open connection
  rpc StreamLocation(stream LocationUpdate) returns (LocationAck);
}

message LocationUpdate {
  string driver_id = 1;
  double latitude = 2;
  double longitude = 3;
  int64 timestamp = 4;
}

message LocationAck {
  bool received = 1;
  string message = 2;
}
